<div class="form-container">
  <h2>{{ isEdit ? 'Editar' : 'Nuevo' }} Restaurante</h2>

  <form (ngSubmit)="submit()">
    <div class="form-group">
      <label for="nombre">Nombre *</label>
      <input
        type="text"
        id="nombre"
        [(ngModel)]="establecimiento.nombre"
        name="nombre"
        required
        placeholder="Ej: La Trattoria" />
    </div>

    <div class="form-group">
      <label for="ubicacion">Ubicación *</label>
      <input
        type="text"
        id="ubicacion"
        [(ngModel)]="establecimiento.ubicacion"
        name="ubicacion"
        required
        placeholder="Ej: Centro Histórico" />
    </div>

    <div class="form-group" style="grid-column: span 2;">
      <label>📍 Marcar en el mapa (opcional pero recomendado)</label>
      <app-map-picker
        [latitud]="establecimiento.latitud ?? null"
        [longitud]="establecimiento.longitud ?? null"
        (locationSelected)="onLocationSelected($event)">
      </app-map-picker>
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        [(ngModel)]="establecimiento.descripcion"
        name="descripcion"
        rows="4"
        placeholder="Describe tu restaurante..."></textarea>
    </div>

    <div class="form-group">
      <label>Fotos del establecimiento</label>
      <div class="fotos-grid">
        <div class="foto-item" *ngFor="let foto of fotos; let i = index">
          <img [src]="foto" alt="Foto {{ i + 1 }}" />
          <span class="foto-badge" *ngIf="i === 0">Principal</span>
          <button type="button" class="foto-remove" (click)="eliminarFoto(i)">✕</button>
        </div>
        <label class="foto-add" [class.disabled]="subiendoFoto">
          <input type="file" accept="image/*" (change)="onFotoSeleccionada($event)" hidden [disabled]="subiendoFoto" />
          <span *ngIf="!subiendoFoto">+ Agregar foto</span>
          <span *ngIf="subiendoFoto">Subiendo...</span>
        </label>
      </div>
      <small>La primera foto será la imagen principal. Recomendado: al menos 3 fotos.</small>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="submitting" class="btn-submit">
        {{ submitting ? 'Guardando...' : (isEdit ? 'Actualizar' : 'Crear') }}
      </button>
      <a routerLink="/oferente/gastronomia/establecimientos" class="btn-cancel">
        Cancelar
      </a>
    </div>
  </form>
</div>
